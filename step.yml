title: Change Working Directory for subsequent Steps
summary: Changes the Working Directory for all subsequent Steps to a specified path.
description: |-
  This Step changes the base Working Directory for every subsequent Step in the Workflow to the specified path.

  Useful, for example, for projects like monorepos where the Bitrise workflow primarily takes place in an `iOS` or `android` subdirectory.

  ### Configuring the Step

  1. Set the **Directory path** to the path you want subsequent Steps to use as their Working Directory.
  2. Use the **Create path if doesn't exist?** input to control whether the path is created when it is missing.

  ### Troubleshooting
  If the Step fails with a "does not exist" error, either set **Create path if doesn't exist?** to `true`, or make sure an earlier Step creates the directory.
  The provided path is resolved to an absolute path before it is applied, so relative paths are resolved against the current Working Directory.

  ### Related Steps
  - [Change value in file](https://www.bitrise.io/integrations/steps/change-value)

website: https://github.com/bitrise-steplib/steps-change-workdir
source_code_url: https://github.com/bitrise-steplib/steps-change-workdir
support_url: https://github.com/bitrise-steplib/steps-change-workdir/issues

type_tags:
- utility

is_requires_admin_user: false
is_always_run: false
is_skippable: false

toolkit:
  go:
    package_name: github.com/bitrise-steplib/steps-change-workdir

inputs:
- path:
  opts:
    title: Directory path
    summary: New working directory path.
    description: The path to set as the base Working Directory for every subsequent Step. It is resolved to an absolute path before being applied.
    is_expand: true
    is_required: true
- is_create_path: "true"
  opts:
    title: Create path if doesn't exist?
    summary: Enable/disable the creation of the directory path in case it doesn't exist yet.
    description: When set to `true`, the Step creates the directory (including parent directories) if it does not exist yet. When set to `false`, the Step fails if the directory is missing.
    is_required: true
    value_options:
    - "true"
    - "false"

outputs:
- BITRISE_SOURCE_DIR:
  opts:
    title: New base Working Directory
    summary: The expanded absolute path applied as the base Working Directory for every subsequent Step.
    description: |-
      The expanded absolute path that the Step set as the base Working Directory.

      Bitrise uses `BITRISE_SOURCE_DIR` as the Working Directory for every subsequent Step, so changing it is how this Step takes effect.
- PWD:
  opts:
    title: Current Working Directory
    summary: The expanded absolute path, also exported as `PWD`.
    description: The expanded absolute path, exported as `PWD` so that subsequent Steps and scripts see the new Working Directory.
